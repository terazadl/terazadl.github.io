name: Publish Life Stream Note

on:
  workflow_dispatch:
    inputs:
      text:
        description: "手记正文"
        required: true
        type: string
      location:
        description: "发生地点"
        required: false
        default: "东京"
        type: string
      badge:
        description: "徽章分类"
        required: false
        default: "日常观察"
        type: string
      tags:
        description: "标签"
        required: false
        default: "日常"
        type: string

permissions:
  contents: write

# Note dates are written with the local clock; keep the runner on site time.
env:
  TZ: Asia/Tokyo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hexo-src-2
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Note to source/_data/notes.yml
        run: |
          node scripts/add-note.js "${{ inputs.text }}" -l "${{ inputs.location }}" -b "${{ inputs.badge }}" -t "${{ inputs.tags }}" --no-build

      - name: Commit and push source update to hexo-src-2
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add source/_data/notes.yml
          git commit -m "feat(life): mobile publish note"
          git push origin hexo-src-2

      # Build + deploy happen in deploy.yml, triggered by the push above.
